# Brick TV marketing site - static, no build step.
[build]
  publish = "."

# The four craft sections and the five-member strip became one page per artist,
# so the old shared pages no longer have an equivalent. Send them home.
[[redirects]]
  from = "/crafts.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/members.html"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The CMS media folder. NOT immutable: filenames here are stable while their
# contents get replaced, so "immutable" told browsers never to re-check a URL
# whose bytes had changed, and Safari honoured that through a hard refresh.
# Revalidate every time instead - the ETag makes a fresh copy a 304 with no body.
[[headers]]
  for = "/assets/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Scripts and styles revalidate rather than sitting in a browser for an hour.
# They change in lockstep with content/*.json, and an hour-stale script paired
# with fresh JSON silently ignores fields it does not know about yet. The files
# are a few KB each and an unchanged one comes back as a 304 with no body, so
# correctness is worth the round trip.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Content the CMS edits: must never be served stale or the site shows old work.
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
