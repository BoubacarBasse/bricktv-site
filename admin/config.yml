# Brick TV - Sveltia CMS
#
# Git-based: every save here is a commit to the repo, which triggers a Netlify
# rebuild. No database, no server to keep running.
#
# Sign-in: the GitHub backend needs an OAuth relay. Netlify can act as one -
# see README "Admin panel". Until that is wired up, sign in with a GitHub
# personal access token (repo scope), which needs no setup at all.

backend:
  name: github
  repo: BoubacarBasse/bricktv-site
  branch: main

# Uploads land here and are referenced from the site root.
media_folder: assets/uploads
public_folder: /assets/uploads

# Shrink phone photos on the way in so full-res originals never hit the site.
media_libraries:
  default:
    config:
      max_file_size: 12000000
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 2000
          height: 2000

collections:
  - name: portfolios
    label: Portfolios
    description: The work shown on each artist page.
    files:
      - name: video
        label: Video - Dr. JPEG
        file: content/video.json
        description: Films on the Video page. Paste a YouTube link or its ID.
        fields:
          - name: items
            label: Films
            label_singular: Film
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: youtube_id, label: YouTube ID or link, widget: string, hint: "Either the full link or just the ID, e.g. elVKPybLQb0" }
              - { name: title, label: Title, widget: string, required: false }

      - name: photo
        label: Photo - Loic Matabishi
        file: content/photo.json
        description: Images on the Photo page.
        fields:
          - name: items
            label: Photographs
            label_singular: Photograph
            widget: list
            summary: '{{fields.caption}}'
            fields:
              - { name: image, label: Image, widget: image }
              - { name: alt, label: Alt text, widget: string, required: false, hint: "Describes the image for screen readers and search." }
              - { name: caption, label: Caption, widget: string, required: false }

      - name: audio
        label: Audio - Maz the Prod
        file: content/audio.json
        description: Tracks on the Audio page.
        fields:
          - name: items
            label: Tracks
            label_singular: Track
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: title, label: Title, widget: string }
              - { name: audio, label: Audio file, widget: file, hint: "MP3 or WAV." }
              - { name: note, label: Note, widget: string, required: false }

      - name: fashion
        label: Fashion - dystopian
        file: content/fashion.json
        description: Looks on the Fashion page.
        fields:
          - name: items
            label: Looks
            label_singular: Look
            widget: list
            summary: '{{fields.caption}}'
            fields:
              - { name: image, label: Image, widget: image }
              - { name: alt, label: Alt text, widget: string, required: false }
              - { name: caption, label: Caption, widget: string, required: false }

  - name: wedding
    label: Wedding page
    description: Everything on the Wedding Packages page. Saving here updates the live page.
    files:
      - name: wedding
        label: Wedding Packages
        file: content/wedding.json
        fields:
          - name: hero
            label: Top of the page
            widget: object
            fields:
              - { name: headline, label: Headline, widget: string, hint: "The big line over the photograph. This one is still a draft, change it to whatever you want." }
              - { name: support, label: Supporting line, widget: string }
              - { name: button, label: Button text, widget: string }
              - { name: image, label: Background photograph, widget: image }
              - { name: alt, label: Photo description, widget: string, required: false, hint: "Describes the photo for screen readers and search. Never shown on the page." }

          - name: section1
            label: First text section
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Text, widget: text }
              - { name: image, label: Photograph, widget: image }
              - { name: alt, label: Photo description, widget: string, required: false }

          - { name: packages_heading, label: Packages heading, widget: string }

          - name: packages
            label: Packages
            label_singular: Package
            widget: list
            summary: '{{fields.name}} - {{fields.price}}'
            hint: "Drag to reorder. Add or remove packages freely, the layout follows."
            fields:
              - { name: name, label: Name, widget: string }
              - { name: price, label: Price, widget: string, hint: "Free text, so \"$1,200\" and \"Consultation-based pricing\" both work." }
              - { name: note, label: Short description, widget: text, required: false }
              - name: items
                label: What is included
                label_singular: Item
                widget: list
                field: { name: item, label: Item, widget: string }
              - { name: tail, label: Closing line, widget: string, required: false, hint: "Optional extra line under the description." }
              - { name: cta, label: Show a Book button on this package, widget: boolean, default: false }
              - { name: cta_text, label: Button text, widget: string, required: false, default: Book an appointment }

          - name: testimonials
            label: Testimonials
            label_singular: Testimonial
            widget: list
            summary: '{{fields.quote}}'
            hint: "One quote shows large and alone. Add a second and they sit side by side."
            fields:
              - { name: quote, label: Quote, widget: text, hint: "Leave the quotation marks out, the page adds those." }
              - { name: attribution, label: Who said it, widget: string, required: false }

          - name: section2
            label: Second text section
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Text, widget: text }
              - { name: image, label: Photograph, widget: image }
              - { name: alt, label: Photo description, widget: string, required: false }

          - name: film
            label: Wedding film
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: url, label: Video link, widget: string, required: false, hint: "A YouTube or Vimeo link. Empty this field and the whole film section disappears from the page." }
              - { name: title, label: Film title, widget: string, required: false }

          - name: closing
            label: Bottom of the page
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: button, label: Button text, widget: string }

          - name: seo
            label: Search engines
            widget: object
            fields:
              - { name: title, label: Page title, widget: string, hint: "Shows in the browser tab and as the headline in search results." }
              - { name: description, label: Description, widget: text, hint: "The sentence under the title in search results." }

  - name: features
    label: Feature images
    description: The wide image at the foot of each artist page, and the home hero.
    files:
      - name: home-hero
        label: Home hero
        file: content/home-hero.json
        description: Background frames behind the BRICK TV wordmark. They cross-fade, about six seconds each.
        fields:
          - name: items
            label: Hero frames
            label_singular: Frame
            widget: list
            max: 12
            fields:
              - { name: image, label: Image, widget: image }
              - { name: alt, label: Alt text, widget: string, required: false }
              - name: focus
                label: Which part of the photo to show
                widget: select
                required: false
                options:
                  - { label: "Very top of the photo", value: "0" }
                  - { label: "Just below the top", value: "5" }
                  - { label: "Near the top", value: "10" }
                  - { label: "A bit above the middle (the usual one)", value: "30" }
                  - { label: "Middle", value: "50" }
                  - { label: "Lower", value: "70" }
                  - { label: "Bottom of the photo", value: "100" }
                hint: "The hero is a wide strip, so a tall photo gets cropped top and bottom. Move this up if a face or head is cut off, down if there is empty space above someone's head. Leave it empty for the usual framing. Note the photo also drifts as it slowly zooms, so check it both ways."

      - name: video-feature
        label: Video page feature
        file: content/video-feature.json
        fields: &feature_fields
          - name: items
            label: Feature image
            widget: list
            max: 1
            fields:
              - { name: image, label: Image, widget: image }
              - { name: alt, label: Alt text, widget: string, required: false }
              - { name: caption, label: Caption, widget: string, required: false }

      - name: photo-feature
        label: Photo page feature
        file: content/photo-feature.json
        fields: *feature_fields

      - name: audio-feature
        label: Audio page feature
        file: content/audio-feature.json
        fields: *feature_fields

      - name: fashion-feature
        label: Fashion page feature
        file: content/fashion-feature.json
        fields: *feature_fields

  - name: settings
    label: Settings
    files:
      - name: site
        label: Contact details
        file: content/site.json
        description: Phone, email and booking link used across the site.
        fields:
          - { name: phone, label: Phone, widget: string }
          - { name: email, label: Email, widget: string }
          - { name: booking_url, label: Booking link, widget: string, hint: "Clear this to send every Book button to the call/email fallback instead." }
          - { name: languages, label: Languages line, widget: string }
